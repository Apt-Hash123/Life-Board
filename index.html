<style>
/* Layout: sticky sliding tab strip (Google Tasks) over masonry "note" cards grouped by category (Google Keep). Sun yellow + leaf green on a fresh lime-tinted ground. */
:root{
  --bg:#F3F6E9; --surface:#FFFFFF; --ink:#18210F; --muted:#5B6750; --line:#DCE4CB;
  --sun:#FFD43B; --leaf:#22C46B; --zest:#B8F23A; --peach:#FF9F6B; --sky:#5AA2FF; --pink:#FF7AB6; --danger:#E5484D;
  --on-bright:#15200B;
  --s1:#1FA85A; --s2:#3B82F6; --s3:#D97706;
  --f1:#15803D; --f2:#22A55A; --f3:#6DCB92; --f4:#B9E6CA;
  --tint:24%;
  --shadow:0 1px 0 rgba(24,33,15,.05), 0 10px 24px -16px rgba(24,33,15,.35);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E120B; --surface:#171D12; --ink:#EEF4E0; --muted:#A0AC8F; --line:#2A3420;
  --sun:#FFD43B; --leaf:#2BD675; --zest:#C2F74A; --peach:#FFA477; --sky:#6BAEFF; --pink:#FF86BE; --danger:#FF6369;
  --tint:15%; --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 28px -18px rgba(0,0,0,.8); color-scheme:dark;
  --f1:#4ADE80; --f2:#2FB463; --f3:#228A4C; --f4:#1C5E37;
}}
:root[data-theme="dark"]{
  --bg:#0E120B; --surface:#171D12; --ink:#EEF4E0; --muted:#A0AC8F; --line:#2A3420;
  --sun:#FFD43B; --leaf:#2BD675; --zest:#C2F74A; --peach:#FFA477; --sky:#6BAEFF; --pink:#FF86BE; --danger:#FF6369;
  --tint:15%; --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 28px -18px rgba(0,0,0,.8); color-scheme:dark;
  --f1:#4ADE80; --f2:#2FB463; --f3:#228A4C; --f4:#1C5E37;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding-block:18px 6px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo{width:34px;height:34px;border-radius:11px;background:var(--sun);display:grid;place-items:center;transform:rotate(-6deg);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.logo svg{width:20px;height:20px}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--leaf)} .sync.err i{background:var(--danger)} .sync.wait i{background:var(--sun);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}
.iconbtn svg{width:20px;height:20px}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.tabs-in{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;position:relative;padding-block:8px}
.tabs-in::-webkit-scrollbar{display:none}
.tab{position:relative;z-index:1;flex:none;padding:9px 16px;border-radius:999px;font-weight:600;color:var(--muted);white-space:nowrap;transition:color .25s;display:flex;align-items:center;gap:7px}
.tab.on{color:var(--on-bright)}
.tab b{font-size:11px;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 9%,transparent);color:inherit}
.tab.on b{background:rgba(0,0,0,.12)}
.pill{position:absolute;z-index:0;top:8px;height:calc(100% - 16px);border-radius:999px;background:var(--sun);transition:left .35s cubic-bezier(.3,1.4,.5,1),width .35s cubic-bezier(.3,1.4,.5,1);box-shadow:inset 0 -2px 0 rgba(0,0,0,.1)}

main{padding-top:18px;min-height:60vh}
.view{}
@keyframes fadeup{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}

/* hero */
.hero{display:flex;align-items:center;gap:20px;margin-bottom:18px}
.hero-txt{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,46px);line-height:1;letter-spacing:-.03em;margin:4px 0 8px;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em;margin:0}
.sub{margin:0;color:var(--muted);max-width:56ch}
.ring{flex:none;width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:800;font-size:24px;line-height:1}
.ring .num small{display:block;font-family:var(--body);font-weight:600;font-size:11px;color:var(--muted);margin-top:2px}
.ring circle{fill:none;stroke-width:10}
.ring .bgc{stroke:color-mix(in srgb,var(--ink) 9%,transparent)}
.ring .fgc{stroke:var(--leaf);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.3,1.2,.5,1)}

.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--sun) 32%,var(--surface));margin-bottom:14px;font-weight:500}
.banner svg{width:22px;height:22px;flex:none}

/* quick add */
.add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border-radius:18px;padding:8px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:10px}
.add input[type=text]{flex:1 1 200px;min-width:0;border:0;background:transparent;padding:10px 10px;font-size:16px;outline:none}
.add .btn{flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;font-weight:700;background:var(--sun);color:var(--on-bright);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink);box-shadow:none}
.btn.green{background:var(--leaf)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:none;padding-inline:8px}
.btn svg{width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--c,var(--ink)) 14%,var(--surface));border:1.5px solid transparent;color:var(--ink);transition:transform .15s}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted));display:inline-block}
.chip.on{border-color:var(--c,var(--ink));background:color-mix(in srgb,var(--c,var(--ink)) 34%,var(--surface))}
.chip:active{transform:scale(.95)}
.addmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 18px}
.csel{position:relative;display:inline-block;max-width:100%}
.csel-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;font-weight:600;font-size:14px;background:color-mix(in srgb,var(--ink) 7%,transparent);max-width:100%}
.csel-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csel i,.copt i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.csel i.none,.copt i.none{background:transparent;border:1.5px dashed var(--muted)}
.csel .chev{width:16px;height:16px;transition:transform .25s}
.csel.open .chev{transform:rotate(180deg)}
.csel-menu{position:absolute;left:0;top:calc(100% + 6px);z-index:35;min-width:230px;max-width:min(300px,86vw);max-height:300px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px -16px rgba(0,0,0,.45);padding:6px;display:none;transform-origin:top}
.csel.open .csel-menu{display:block;animation:drop .22s cubic-bezier(.2,1.2,.4,1)}
.sheet .csel{display:block}
.sheet .csel-menu{position:static;margin-top:6px;max-width:none;width:100%;max-height:none;box-shadow:none}
.csel.up .csel-menu{top:auto;bottom:calc(100% + 6px);transform-origin:bottom}
@keyframes drop{from{opacity:0;transform:translateY(-6px) scaleY(.85)}}
.copt{display:flex;width:100%;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-weight:600;text-align:left}
.copt:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.copt.on{background:color-mix(in srgb,var(--sun) 35%,var(--surface))}
.cnew{display:flex;gap:6px;padding:6px 4px 2px;border-top:1px solid var(--line);margin-top:4px}
.cnew input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:7px 9px;background:var(--bg);outline:none}
.cnew input:focus{border-color:var(--ink)}
.cnew .btn{padding:7px 12px}
.datepick{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);background:color-mix(in srgb,var(--ink) 6%,transparent);padding:4px 10px;border-radius:999px}
.datepick input{border:0;background:transparent;font-size:13px;color:var(--ink);max-width:140px}

/* sections */
.sec{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px}
.sec .muted{font-size:13px}
.muted{color:var(--muted)}
.linkbtn{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--sun);text-decoration-thickness:3px;text-underline-offset:3px}

/* task list */
.list{background:var(--surface);border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.trow{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);transition:background .2s}
.trow:last-child{border-bottom:0}
.trow .tx{flex:1;min-width:0}
.trow .tt{font-weight:600;overflow-wrap:anywhere}
.trow.done .tt{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;font-size:12px;color:var(--muted);align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.late{background:color-mix(in srgb,var(--danger) 22%,var(--surface));color:var(--ink);padding:2px 8px;border-radius:999px;font-weight:600}
.soon{background:color-mix(in srgb,var(--peach) 40%,var(--surface));color:var(--ink);padding:2px 8px;border-radius:999px;font-weight:600}
.dl span{display:inline-flex;align-items:center;gap:4px}
.dl svg{width:12px;height:12px}
.hmeta.dl{margin-top:6px}
.intask .trow{padding:10px 0;background:none;border-bottom-color:color-mix(in srgb,var(--ink) 12%,transparent)}
.star{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none;transition:transform .2s}
.star svg{width:18px;height:18px;stroke:currentColor}
.star.on{color:#E8A500}
.star.on svg{fill:#FFD43B;stroke:#C58A00}
.star:active{transform:scale(.85)}
.carry{background:color-mix(in srgb,var(--peach) 30%,var(--surface));color:var(--ink);padding:2px 8px;border-radius:999px;font-weight:600}
.due{background:color-mix(in srgb,var(--sky) 24%,var(--surface));color:var(--ink);padding:2px 8px;border-radius:999px;font-weight:600}
.more{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.more:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.more svg{width:18px;height:18px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:18px;margin-bottom:4px}
details.fold{margin-top:10px}
details.fold summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;padding:8px 4px;list-style:none;display:flex;align-items:center;gap:6px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary svg{width:16px;height:16px;transition:transform .2s}
details[open].fold summary svg{transform:rotate(90deg)}

/* checkbox */
.check{flex:none;width:28px;height:28px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--ink) 35%,transparent);display:grid;place-items:center;transition:background .2s,border-color .2s,transform .2s;margin-top:-1px}
.check svg{width:16px;height:16px;stroke:var(--on-bright);opacity:0;transform:scale(.4);transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.check:hover{border-color:var(--leaf)}
.check.on{background:var(--leaf);border-color:var(--leaf)}
.check.on svg{opacity:1;transform:none}
.check.sq{border-radius:8px;width:24px;height:24px}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}

/* peek strip */
.peek{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.pk{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) var(--tint),var(--surface));border:1px solid color-mix(in srgb,var(--c) 40%,transparent);font-weight:600;font-size:14px}
.pk .dot{width:22px;height:22px;border-radius:50%;border:2px solid color-mix(in srgb,var(--ink) 35%,transparent);display:grid;place-items:center}
.pk.on{opacity:.65}
.pk.on .dot{background:var(--leaf);border-color:var(--leaf)}
.pk .dot svg{width:12px;height:12px;stroke:var(--on-bright);opacity:0}
.pk.on .dot svg{opacity:1}

/* resizable boards: a column grid with 4px rows, each card spans N columns and enough rows for its height */
.board{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));grid-auto-rows:4px;column-gap:14px;row-gap:0;grid-auto-flow:row dense;align-items:start}
.board>.card{grid-column:span var(--span,1);position:relative;display:flex;flex-direction:column;min-width:0}
.cbody{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}
.card.fixed{overflow:hidden}
.grip{position:absolute;right:3px;bottom:3px;width:24px;height:24px;border-radius:8px;cursor:nwse-resize;touch-action:none;opacity:.4;transition:opacity .2s,background .2s;
  background:linear-gradient(135deg,transparent 52%,var(--ink) 52%,var(--ink) 58%,transparent 58%,transparent 70%,var(--ink) 70%,var(--ink) 76%,transparent 76%)}
.card:hover .grip,.grip:focus-visible,.card.resizing .grip{opacity:.85}
.card.resizing{outline:2px dashed var(--ink);outline-offset:2px;z-index:2;transition:none}
.newbox{display:flex!important;flex-direction:row!important;align-items:center;justify-content:center;gap:8px;min-height:84px;background:transparent!important;border:2px dashed color-mix(in srgb,var(--ink) 22%,transparent)!important;color:var(--muted);font-weight:700;transition:border-color .2s,color .2s}
.newbox:hover{border-color:var(--ink)!important;color:var(--ink)}
.newbox svg{width:20px;height:20px}
.boxacts{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.iconbtn.pinned{color:var(--ink);background:color-mix(in srgb,var(--sun) 40%,transparent)}
.chart-note{font-size:12px;margin:6px 0 0}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sun);color:var(--on-bright);font-family:var(--display);font-weight:800;font-size:17px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);transition:transform .2s}
.avatar svg{width:20px;height:20px}
.avatar:hover,.avatar.on{transform:scale(1.06);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--sun)}
.avatar.big{width:64px;height:64px;font-size:28px;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.avatar.big svg{width:30px;height:30px}
.prof-h{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.prof-name{flex:1 1 200px;min-width:0;display:grid;gap:4px}
.prof-name input{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;border:0;border-bottom:2px dashed transparent;background:transparent;padding:2px 0;outline:none;width:100%;min-width:0}
.prof-name input:hover,.prof-name input:focus{border-bottom-color:var(--line)}
.rev-h{align-items:center;flex-wrap:wrap}
.rev-h .seg{margin-left:auto}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pgrid .panel{margin:0;min-width:0}
.pgrid .wide{grid-column:1/-1}
.chart.tall{height:220px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-left:auto}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend.col{display:grid;grid-template-columns:1fr 1fr;margin:10px 0 0}
.legend b{color:var(--ink);margin-left:4px;font-variant-numeric:tabular-nums}
.hb{display:grid;grid-template-columns:minmax(0,10em) 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:7px}
.hb-l .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.hb-t{height:10px;border-radius:4px;background:color-mix(in srgb,var(--ink) 7%,transparent);overflow:hidden}
.hb-t span{display:block;height:100%;border-radius:0 4px 4px 0;transition:width .8s cubic-bezier(.3,1.2,.5,1)}
.hb-v{font-weight:700;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.stackbar{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden}
.stackbar span{min-width:6px}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:7px 10px;border-radius:10px;max-width:260px;box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
@media (max-width:760px){.pgrid{grid-template-columns:1fr}.hb{grid-template-columns:minmax(0,8em) 1fr auto}.prof-name input{font-size:24px}}

.stat .v{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--ink) 9%,transparent);overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .8s cubic-bezier(.3,1.2,.5,1)}

/* goals */
.grow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px dashed color-mix(in srgb,var(--ink) 14%,transparent)}
.grow:first-of-type{border-top:0}
.gmain{flex:1;min-width:0;text-align:left}
.strip{display:flex;gap:3px;margin-top:7px}
.strip i{width:10px;height:10px;border-radius:3px;background:color-mix(in srgb,var(--surface) 70%,transparent);display:block}
.strip i.on{background:var(--leaf)}
.gcount{flex:none;width:74px;border-radius:16px;padding:8px 4px 7px;background:var(--surface);border:2px solid color-mix(in srgb,var(--ink) 12%,transparent);text-align:center;transition:transform .15s,background .2s,border-color .2s}
.gcount .n{display:block;font-family:var(--display);font-weight:800;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.gcount .l{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-top:3px}
.gcount.on{background:var(--leaf);border-color:var(--leaf);color:var(--on-bright)}
.gcount.on .l{color:var(--on-bright)}
.gcount:active{transform:scale(.94)}
.gbar{height:6px;border-radius:9px;background:color-mix(in srgb,var(--surface) 70%,transparent);margin-top:7px;overflow:hidden}
.gbar span{display:block;height:100%;background:var(--ink);border-radius:9px}

/* lists */
.li{display:flex;align-items:flex-start;gap:10px;padding:6px 0}
.li span{flex:1;min-width:0;overflow-wrap:anywhere;padding-top:1px}
.li.done span{text-decoration:line-through;color:var(--muted)}
.li .x{opacity:0;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.li:hover .x,.li .x:focus-visible{opacity:1}
.li .x svg{width:14px;height:14px}
@media (hover:none){.li .x{opacity:.6}}
.additem{display:flex;gap:8px;align-items:center;margin-top:4px}
.additem input{flex:1;min-width:0;border:0;border-bottom:1.5px dashed color-mix(in srgb,var(--ink) 25%,transparent);background:transparent;padding:7px 2px;outline:none}
.additem input:focus{border-bottom-color:var(--ink)}
.notetext{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.donecount{font-size:13px;color:var(--muted);font-weight:600;margin-top:6px;padding-top:8px;border-top:1px solid color-mix(in srgb,var(--ink) 10%,transparent);display:block;width:100%;text-align:left}

/* wins */
.narrow{max-width:720px;margin:0 auto;display:grid;gap:14px}
.narrow .panel{margin:0}
.winbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.two>*{min-width:0}
.win{display:flex;gap:10px;padding:10px 0;border-top:1px dashed color-mix(in srgb,var(--ink) 14%,transparent)}
.win:first-child{border-top:0}
.win .d{flex:none;width:44px;text-align:center;font-family:var(--display);font-weight:800;line-height:1;padding-top:2px}
.win .d small{display:block;font-family:var(--body);font-size:11px;font-weight:600;color:var(--muted)}
.win p{margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
textarea.write{width:100%;min-height:76px;resize:vertical;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);outline:none}
textarea.write:focus{border-color:var(--ink)}
.catrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-top:1px dashed color-mix(in srgb,var(--ink) 14%,transparent)}
.catrow:first-of-type{border-top:0}
.catrow .what{font-size:13px;color:var(--muted)}
.hl{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.hl i{flex:none;width:26px;height:26px;border-radius:9px;background:var(--sun);display:grid;place-items:center;margin-top:-2px}
.hl i svg{width:15px;height:15px;stroke:var(--on-bright)}
.ai{margin-top:12px;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--zest) 26%,var(--surface));white-space:pre-wrap}
.feedday{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.feedday:first-child{margin-top:0}
.feed{font-size:14px;display:flex;gap:8px;align-items:center;padding:3px 0}
.feed i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}

/* calendar */
.calwrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.calh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calh h2{flex:1;font-size:22px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.06em;text-transform:uppercase;padding-bottom:4px}
.day{aspect-ratio:1/1.05;max-width:100%;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);padding:6px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;transition:transform .15s,border-color .2s;min-width:0;overflow:hidden}
.day:hover{border-color:color-mix(in srgb,var(--ink) 35%,transparent)}
.day.out{opacity:.4}
.day.today .dn{background:var(--sun);color:var(--on-bright)}
.day.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.dn{font-family:var(--display);font-weight:800;font-size:13px;min-width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.dots{display:flex;flex-wrap:wrap;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c);display:block}
.hbar{margin-top:auto;width:100%;height:5px;border-radius:9px;background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden}
.hbar span{display:block;height:100%;background:var(--leaf)}
.dayp .item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.dayp .item:first-child{border-top:0}
.dayp .item .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.addev{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.addev input{min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--surface);outline:none}
.addev input:focus{border-color:var(--ink)}
.addev .row2{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* FAB */
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;width:62px;height:62px;border-radius:20px;background:var(--sun);color:var(--on-bright);display:grid;place-items:center;box-shadow:0 10px 26px -8px rgba(0,0,0,.45),inset 0 -4px 0 rgba(0,0,0,.12);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.fab:hover{transform:rotate(90deg) scale(1.05)}
.fab svg{width:28px;height:28px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,14,8,.45);animation:fade .2s ease both}
@keyframes fade{from{opacity:0}}
.sheet-in{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,1.2,.4,1) both}
@media (min-width:700px){.sheet{align-items:center}.sheet-in{border-radius:26px;padding:24px}}
@keyframes up{from{transform:translateY(60px);opacity:.3}}
.sheet-h{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sheet-h h2{flex:1;font-size:22px}
.field{display:grid;gap:7px;margin-bottom:16px}
.field>label,.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=time],.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);outline:none;font-size:16px}
.field input:focus,.field textarea:focus{border-color:var(--ink)}
.stepper{display:inline-flex;align-items:center;gap:10px}
.stepper button{width:36px;height:36px;border-radius:11px;background:color-mix(in srgb,var(--ink) 8%,transparent);font-size:20px;font-weight:700}
.stepper b{font-family:var(--display);font-size:22px;min-width:28px;text-align:center}
.dtog{display:flex;gap:6px;flex-wrap:wrap}
.dtog button{width:44px;height:38px;border-radius:11px;font-weight:700;font-size:13px;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.dtog button.on{background:var(--leaf);color:var(--on-bright)}
.switch{display:flex;align-items:center;gap:10px;font-weight:600}
.switch input{width:20px;height:20px;accent-color:var(--leaf)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat button{width:15px;height:15px;border-radius:4px;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.heat button.on{background:var(--leaf)}
.heat button.t{outline:2px solid var(--ink);outline-offset:-1px}
.heat button:disabled{opacity:.25;cursor:default}
.sheet-f{display:flex;gap:8px;align-items:center;margin-top:8px}
.sheet-f .sp{flex:1}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;background:var(--c);border:3px solid transparent}
.sw.on{border-color:var(--ink)}
.catedit{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.catedit input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);outline:none}
.catedit .sw{width:26px;height:26px;flex:none}
.catbtn{width:100%;text-align:left;font-weight:600}
.catbtn .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catbtn svg{width:16px;height:16px;color:var(--muted)}
.cat-title{font:inherit;color:inherit;text-align:left;border-radius:8px;padding:0 4px;margin:0 -4px;overflow-wrap:anywhere}
.cat-title:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.delbox{margin-top:14px;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--danger) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--danger) 35%,transparent)}
.delbox .csel-menu{position:static;margin-top:6px;width:100%;max-width:none;box-shadow:none}

/* toast + confetti */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:40;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;transition:all .3s cubic-bezier(.3,1.4,.5,1);pointer-events:none;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--sun);font-weight:800}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{30%{transform:scale(1.25) rotate(-4deg)}}

@media (max-width:760px){
  .two,.calwrap{grid-template-columns:1fr}
  .board{column-gap:10px}
  .board .card{padding:12px 11px 8px;margin-bottom:10px}
  .hero{gap:14px}
  .ring{width:80px;height:80px}
  .day{padding:4px;border-radius:10px}
  .dn{font-size:12px;min-width:20px;height:20px}
  .dots i{width:6px;height:6px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.demobar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:14px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--sky) 22%,var(--surface));font-weight:600;font-size:14px}
.demobar .btn{padding:7px 12px}
.welcome{display:grid;gap:12px;justify-items:start;padding:4px 2px}
.welcome h2{font-size:26px}
.welcome p{margin:0}
.logo.big{width:56px;height:56px;border-radius:17px}
.logo.big svg{width:32px;height:32px}
.welcome-acts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
</style>

const GAP = () => innerWidth <= 760 ? 10 : 14;

    const cols = boardCols(b), def = +b.dataset.def || 1, g = GAP();
    b.style.setProperty('--cols', cols); b._cols = cols;
    const cards = $$(':scope > .card', b);

  });
}

document.addEventListener('pointerdown', e => {
  const g = e.target.closest('.grip'); if (!g) return;

let aiText = '';
function report(nDays, filt) {
  const keys = Array.from({length: nDays}, (_, i) => key(addDays(parse(TODAY), i - nDays + 1)));
  const inR = k => k && keys.includes(k);
  const okCat = c => !filt || c === filt;
  const tasks = state.today.items.filter(t => inR(t.done) && okCat(t.cat));
  const evs = state.events.items.filter(e => e.done && inR(e.date) && okCat(e.cat));
  let chk = 0, exp = 0;
  const catAgg = {};
  const agg = id => (catAgg[id] ||= {tasks: 0, checks: 0, exp: 0, goals: []});
  tasks.forEach(t => agg(t.cat || '').tasks++);
  evs.forEach(e => agg(e.cat || '').tasks++);
  const habitInfo = [];
  state.habits.items.filter(h => okCat(h.cat)).forEach(h => {
    const n = keys.filter(k => has(h, k)).length; const s = h.sched;
    const since = [h.since || '9999', ...Object.keys(h.log)].sort()[0];
    const ek = keys.filter(k => k >= since);
    let e = 0;
    if (s.type === 'daily') e = ek.length;
    else if (s.type === 'days') e = ek.filter(k => s.days.includes(wdIdx(parse(k)))).length;
    else if (s.type === 'week') e = ek.length ? Math.max(1, Math.round(s.n * ek.length / 7)) : 0;
    else if (s.type === 'month') e = ek.length ? Math.max(1, Math.round(s.n * ek.length / 30)) : 0;
    chk += Math.min(n, e || n); exp += e;
    const a = agg(h.cat || ''); a.checks += n; a.exp += e;
    habitInfo.push({h, n, e, st: streak(h, TODAY), cat: h.cat});
  });
  const goalInfo = state.goals.items.filter(g => okCat(g.cat)).map(g => ({g, n: keys.filter(k => gHas(g, k)).length, total: gStats(g).total}));
  goalInfo.forEach(x => { if (x.n) agg(x.g.cat || '').goals.push(`${x.g.name} ${x.n}d`); });
  const goalDays = goalInfo.reduce((a, x) => a + x.n, 0);
  const label = nDays === 7 ? 'in the last 7 days' : `in the last ${nDays} days`;
  const hl = [];
  const bestStreak = habitInfo.filter(x => x.st.n > 1).sort((a, b) => b.st.n - a.st.n)[0];
  if (bestStreak) hl.push(`<b>${esc(bestStreak.h.name)}</b> is on a ${bestStreak.st.n} ${bestStreak.st.unit} streak.`);
  const perfect = habitInfo.filter(x => x.e && x.n >= x.e);
  if (perfect.length) hl.push(`You hit your target for <b>${perfect.slice(0, 3).map(x => esc(x.h.name)).join(', ')}</b>${perfect.length > 3 ? ` and ${perfect.length - 3} more` : ''} ${label}.`);
  const topGoal = goalInfo.filter(x => x.n).sort((a, b) => b.n - a.n)[0];
  if (topGoal) hl.push(`Most time on goals went to <b>${esc(topGoal.g.name)}</b>: ${topGoal.n} day${topGoal.n === 1 ? '' : 's'} ${label}, ${topGoal.total} in total.`);
  const milestone = goalInfo.find(x => x.total && x.total % 10 === 0 && x.n);
  if (milestone) hl.push(`<b>${esc(milestone.g.name)}</b> reached ${milestone.total} days. Nice round number.`);
  state.habits.items.filter(h => h.unit && okCat(h.cat)).forEach(h => {
    const ser = numSeries(h).filter(p => inR(p.k));
    if (ser.length > 1) { const dlt = Math.round((ser[ser.length - 1].v - ser[0].v) * 10) / 10; hl.push(`<b>${esc(h.name)}</b>: ${ser[0].v} → ${ser[ser.length - 1].v} ${esc(h.unit)} (${dlt > 0 ? '+' : ''}${dlt}) ${label}.`); }
  });
  if (tasks.length >= 5) hl.push(`${tasks.length} tasks cleared off your list ${label}.`);
  state.goals.items.filter(g => g.deadline && okCat(g.cat)).map(g => [g, dlInfo(g)]).filter(([, d]) => d.left >= 0 && d.left <= 30).sort((a, b) => a[1].left - b[1].left).slice(0, 2)
    .forEach(([g, d]) => hl.push(`<b>${esc(g.name)}</b> deadline ${d.left === 0 ? 'is today' : `in ${d.left} day${d.left === 1 ? '' : 's'}`}${d.reach ? `, and there aren't enough days left to reach ${g.target}` : d.need ? `. Aim for ${d.need} day${d.need === 1 ? '' : 's'} a week to hit ${g.target}` : ''}.`));

    if (a.tasks) parts.push(`${a.tasks} task${a.tasks === 1 ? '' : 's'} done`);
    if (a.goals.length) parts.push(`goals: ${a.goals.join(', ')}`);

}

/* year in pixels: one square per day, darker = more done */
function yearPanel() {
  const cnt = {};
  const add = k => { cnt[k] = (cnt[k] || 0) + 1; };
  state.habits.items.forEach(h => Object.keys(h.log).forEach(k => { if (has(h, k)) add(k); }));
  state.today.items.forEach(t => { if (t.done) add(t.done); });
  state.goals.items.forEach(g => Object.keys(g.log).forEach(k => { if (g.log[k]) add(k); }));
  state.events.items.forEach(e => { if (e.done) add(e.date); });
  const end = parse(TODAY), start = addDays(weekStart(end), -52 * 7);
  const days = []; for (let d = new Date(start); key(d) <= TODAY; d = addDays(d, 1)) days.push(key(d));
  const lvl = n => !n ? 0 : n <= 2 ? 1 : n <= 5 ? 2 : n <= 9 ? 3 : 4;
  const active = days.filter(k => cnt[k]).length;
  let best = 0, run = 0; days.forEach(k => { run = cnt[k] ? run + 1 : 0; best = Math.max(best, run); });
  let cur = 0; for (let i = days.length - 1; i >= 0; i--) { if (cnt[days[i]]) cur++; else if (days[i] !== TODAY) break; }
  const months = []; days.forEach((k, i) => { if (k.endsWith('-01') || i === 0) months.push([Math.floor(i / 7), fmt(k, {month: 'short'})]); });
  return `<section class="panel wide">
    <div class="panel-h"><h2>Your year</h2><span class="muted" style="margin-left:auto;font-size:13px">${active} active day${active === 1 ? '' : 's'} · current run ${cur} · best run ${best}</span></div>
    <div class="year-wrap" id="yearWrap"><div class="year" style="--weeks:${Math.ceil(days.length / 7)}">
      <div class="ymonths">${months.map(([w, m]) => `<span style="grid-column:${w + 1}">${m}</span>`).join('')}</div>
      <div class="ygrid">${days.map(k => `<button class="yd l${lvl(cnt[k])} ${k === TODAY ? 'now' : ''}" data-act="year-day" data-day="${k}" data-tip="${fmt(k, {weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'})}: ${cnt[k] || 0} thing${cnt[k] === 1 ? '' : 's'} done" aria-label="${fmt(k)}: ${cnt[k] || 0} done"></button>`).join('')}</div>

    if ((lw === 'every' || lw === 'each') && words[i + 1]) {

      while (j < words.length) { const d = low(words[j]); if (d === 'day') { days = ALLDAYS.slice(); j++; break; } if (d === 'weekday' || d === 'weekdays') { days = [0, 1, 2, 3, 4]; j++; break; } if (d === 'weekend' || d === 'weekends') { days = [5, 6]; j++; break; } if (d in DAYMAP) { days.push(DAYMAP[d]); j++; continue; } if ((d === 'and' || d === '&') && days.length) { j++; continue; } break; }
      if (days.length) { out.days = [...new Set(days)].sort(); i = j - 1; continue; }
    }
    if (lw === 'daily') { out.days = ALLDAYS.slice(); continue; }
    if (lw === 'weekdays') { out.days = [0, 1, 2, 3, 4]; continue; }
    if (lw === 'tomorrow' || lw === 'tmrw' || lw === 'tmr' || lw === 'tmw') { out.due = key(addDays(parse(TODAY), 1)); continue; }
    if (lw === 'today' || lw === 'tonight') { out.due = ''; continue; }
    if ((lw === 'on' || lw === 'next' || lw === 'this') && low(words[i + 1]) in DAYMAP) { const wd = DAYMAP[low(words[i + 1])]; let n = (wd - wdIdx(parse(TODAY)) + 7) % 7; if (lw === 'next' && n === 0) n = 7; out.due = n ? key(addDays(parse(TODAY), n)) : ''; i++; continue; }
    if (lw === 'in' && /^\d+$/.test(words[i + 1] || '') && /^(day|days|week|weeks)$/.test(low(words[i + 2]))) { const n = +words[i + 1] * (/week/.test(low(words[i + 2])) ? 7 : 1); out.due = key(addDays(parse(TODAY), n)); i += 2; continue; }
    if (/^\d{1,2}(st|nd|rd|th)?$/.test(lw) && low(words[i + 1]) in MONTHS) { const d = dateFrom(parseInt(lw), MONTHS[low(words[i + 1])]); if (d) { out.due = d; i++; continue; } }
    if (lw in MONTHS && /^\d{1,2}(st|nd|rd|th)?$/.test(low(words[i + 1]))) { const d = dateFrom(parseInt(low(words[i + 1])), MONTHS[lw]); if (d) { out.due = d; i++; continue; } }
    if (lw in DAYMAP && i === words.length - 1 && keep.length) { const n = (DAYMAP[lw] - wdIdx(parse(TODAY)) + 7) % 7; out.due = n ? key(addDays(parse(TODAY), n)) : ''; continue; }
    keep.push(w);
  }
  out.text = keep.join(' ');
  return out;
}

  if (q.due) bits.push(`<span class="qchip">${I.cal}${q.due === key(addDays(parse(TODAY), 1)) ? 'Tomorrow' : fmt(q.due)}</span>`);

/* ---------- actions ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.closest('#sheet')) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a === 'tab') return go(b.dataset.tab);
  if (a === 'deck') return openDeck(b.dataset.g);
  if (a === 'year-day') { const c = groups().find(g => g.type === 'calendar'); if (c) { selDay = b.dataset.day; calMonth = selDay.slice(0, 7); if (c.hidden) { c.hidden = false; commit('settings'); } go(c.id); } return; }
  if (a === 'go-cal') { const c = groups().find(g => g.type === 'calendar'); if (c) { if (c.hidden) { c.hidden = false; commit('settings'); } go(c.id); } return; }
  if (a === 'settings') return tab === 'profile' ? settingsSheet() : go('profile');
  if (a === 'task-check') {
    const t = state.today.items.find(x => x.id === id); if (!t) return;
    const prev = leftNow(); t.done = t.done ? '' : TODAY;
    if (t.done) {
      burst(...at(b), 20); buzz();
      const row = b.closest('.trow'); b.classList.add('on'); row && row.classList.add('leaving');
      setTimeout(() => { commit('today'); if (!celebrateIfClear(prev)) toast(cheer(), () => { t.done = ''; commit('today'); }); }, reduce ? 0 : 520);
    }
    else commit('today');
    return;
  }
  if (a === 'task-edit') return taskSheet(id);
  if (a === 'task-star') {
    const t = state.today.items.find(x => x.id === id); if (!t) return;
    if (!t.star && state.today.items.filter(x => x.star && !x.done).length >= 3) return toast('You already have a Top 3. Unstar one first.');
    t.star = !t.star; if (t.star) burst(...at(b), 12); commit('today'); return;
  }
  if (a === 'habit-check' || a === 'habit-day') {
    const h = state.habits.items.find(x => x.id === id); if (!h) return;
    const day = b.dataset.day || TODAY;
    if (has(h, day)) { delete h.log[day]; commit('habits'); return; }
    if (h.unit) return logSheet(id, day);
    const gainers = goalsFor(h).filter(g => !gHas(g, day));

/* check-in deck: one big card per habit still due today */
function openDeck(gid) {
  const queue = state.habits.items.filter(h => groupOf(h, 'habits') === gid).filter(h => { const x = hStats(h); return x.due && !x.doneToday; });
  if (!queue.length) return;
  let i = 0, done = 0, skipped = 0;
  const root = document.createElement('div'); root.className = 'deck'; root.setAttribute('role', 'dialog'); root.setAttribute('aria-modal', 'true'); root.setAttribute('aria-label', 'Habit check-in');
  document.body.appendChild(root); document.body.style.overflow = 'hidden';

  const card = h => { const x = hStats(h), c = cat(h.cat), wk = weekKeys(parse(TODAY));
    return `<div class="dcard" style="--c:${c.color}">
      <span class="dcat"><i></i>${esc(c.name)}</span>
      <h2>${esc(h.name)}</h2>
      <p class="dmeta">${x.target ? `${x.count}/${x.target} ${x.period}` : `${x.weekDone} this week`}${x.streak.n > 1 ? ` · <span class="streak">${I.flame}${x.streak.n} ${x.streak.unit} streak</span>` : ''}</p>
      <div class="week big">${wk.map((k, j) => `<span class="wd ${has(h, k) ? 'on' : ''} ${k === TODAY ? 'today' : ''}">${DOW[j][0]}</span>`).join('')}</div>
      ${h.unit ? `<label class="dnum"><input type="number" inputmode="decimal" step="0.1" id="deckNum" value="${numSeries(h).at(-1)?.v ?? ''}" aria-label="${esc(h.unit)}"><span>${esc(h.unit)}</span></label>` : ''}
    </div>`; };
  const draw = () => {
    if (i >= queue.length) {
      root.innerHTML = `<div class="deck-in"><div class="dend"><div class="dbig">${done ? '🎉' : '👍'}</div><h2>${done ? 'Check-in done!' : 'All caught up'}</h2><p class="muted">${done} ticked${skipped ? ` · ${skipped} skipped for now` : ''}</p><button class="btn" data-d="close">Back to my habits</button></div></div>`;
      if (done) burst(innerWidth / 2, innerHeight / 3, 120, true);
      return;
    }
    root.innerHTML = `<div class="deck-in">

    el.addEventListener('pointermove', e => { if (x0 === null) return; dx = e.clientX - x0; el.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`; el.dataset.lean = dx > 40 ? 'r' : dx < -40 ? 'l' : ''; });
    el.addEventListener('pointerup', () => { if (x0 === null) return; x0 = null; el.style.transition = ''; if (dx > 110) next(true); else if (dx < -110) next(false); else { el.style.transform = ''; el.dataset.lean = ''; } });

function openPalette(prefill = '') {
  if ($('.palette')) return;
  const root = document.createElement('div'); root.className = 'palette'; root.innerHTML = `<div class="pal-in" role="dialog" aria-modal="true" aria-label="Command bar"><div class="pal-q">${I.chev}<input type="text" id="palQ" placeholder="Jump to, add a task, tick a habit…" autocomplete="off" aria-controls="palList"></div><div class="pal-list" id="palList" role="listbox"></div><div class="pal-f"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> run</span><span><kbd>Esc</kbd> close</span></div></div>`;

  if (!active) return;
  swallowClick = true; setTimeout(() => { swallowClick = false; }, 60);
  row.classList.remove('swiping'); row.style.transform = '';
  const armed = row.classList.contains('armed'); row.classList.remove('armed'); delete row.dataset.sw;
  if (!armed) return;
  const k = row.dataset.k || '';
  setTimeout(() => {
    if (dx > 0) { const c = row.querySelector('.check'); if (c && !c.classList.contains('on')) c.click(); return; }
    if (k.startsWith('t-')) { const t = state.today.items.find(x => x.id === k.slice(2)); if (t) trashToast('task', t); }
    else if (k.startsWith('e-')) { const ev = state.events.items.find(x => x.id === k.slice(2)); if (ev) trashToast('event', ev); }
    else if (row.classList.contains('li')) { const x = row.querySelector('[data-act="item-del"]'); if (x) x.click(); }
  }, 80);
};
addEventListener('pointerup', swEnd); addEventListener('pointercancel', swEnd);
document.addEventListener('click', e => { if (swallowClick) { e.stopPropagation(); e.preventDefault(); swallowClick = false; } }, true);

/* swipe between tabs on phones */
let sx = 0, sy = 0, st = 0;
$('#view').addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, {passive: true});
$('#view').addEventListener('touchend', e => {
  const t = e.changedTouches[0]; const dx = t.clientX - sx, dy = t.clientY - sy;
  if (Date.now() - st > 600 || Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * .6) return;
  if (e.target.closest('.peek,.heat,.chips,input,textarea,.trow,.li,.hrow,.grow')) return;
  const vg = visGroups(); const i = vg.findIndex(x => x.id === tab); if (i < 0) return; const n = vg[i + (dx < 0 ? 1 : -1)]; if (n) go(n.id);
}, {passive: true});

/* new day check */
function dayCheck() {
  const k = key(new Date());
  if (k !== TODAY) { TODAY = k; selDay = k; calMonth = k.slice(0, 7); spawnRepeats(); render(); toast('Good morning! New day, fresh page.'); maybeMorning(); }
}
setInterval(dayCheck, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) dayCheck(); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (isView(h)) go(h); });
let rzT = 0; window.addEventListener('resize', () => { movePill(false); clearTimeout(rzT); rzT = setTimeout(() => { drawCharts(); drawBars(); layoutBoards(); }, 120); });

/* ---------- standalone app extras ---------- */
function downloadBackup() {
  const blob = new Blob([JSON.stringify(state, null, 1)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `life-board-backup-${TODAY}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  pref.lastBackup = TODAY; savePref(); toast('Backup downloaded');
}
function applyBackup(text) {
  try { const p = JSON.parse(text); if (!p.habits || !p.today) throw 0; DOCS.forEach(n => { if (p[n]) state[n] = p[n]; }); normalizeAll(); pref.demo = false; savePref(); closeSheet(); commit(...DOCS); toast('Backup restored'); }
  catch (err) { toast("That file isn't a Life Board backup."); }
}
document.addEventListener('change', e => { if (e.target.id === 'restoreFile' && e.target.files[0]) { const r = new FileReader(); r.onload = () => applyBackup(r.result); r.readAsText(e.target.files[0]); } });
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

  const weight = {}; for (let i = 30; i >= 1; i--) { if (rnd() < .8) weight[d(-i)] = Math.round((70.9 + i * 0.055 + (rnd() - .5) * .35) * 10) / 10; }

function startFresh() { DOCS.forEach(n => state[n] = clone(EMPTY[n])); loadStarter(); normalizeAll(); pref.demo = false; pref.welcomed = true; savePref(); saveLocal(); go(visGroups()[0].id); render(); }
function welcomeSheet() {
  openSheet(`<div class="welcome"><span class="logo big">${'<svg viewBox="0 0 24 24" fill="none" stroke="#15200B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'}</span>
